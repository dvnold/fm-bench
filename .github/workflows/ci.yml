name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # macOS minutes cost 10x, so the matrix covers each Node release line that
    # is still maintained (engines: node >=22) rather than every minor.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    runs-on: macos-15
    timeout-minutes: 15
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - name: Lint, test, and verify package contents
        run: npm run check
      - name: CLI smoke tests
        env:
          # Hosted runners are not macOS 27 and have no Apple fm. Point the CLI
          # at the fake so benchmark paths are still exercised end to end.
          FM_BIN: ${{ github.workspace }}/test/fixtures/fake-fm.mjs
        run: |
          set -euo pipefail
          node bin/fm-bench.js --version
          node bin/fm-bench.js --help > /dev/null
          node bin/fm-bench.js legend --json | node -e "const fs=require('fs');const entries=JSON.parse(fs.readFileSync(0,'utf8'));if(!Array.isArray(entries)||entries.length<10)throw new Error('legend --json output looks wrong')"
          node bin/fm-bench.js doctor
          node bin/fm-bench.js models --format json | node -e "const fs=require('fs');const models=JSON.parse(fs.readFileSync(0,'utf8'));if(!Array.isArray(models)||models[0]?.identity!=='AFM 3 Core Advanced')throw new Error('models --json output looks wrong')"
          node bin/fm-bench.js --profile quick --runs 2 --no-progress --json | node -e "const fs=require('fs');const report=JSON.parse(fs.readFileSync(0,'utf8'));if(report.version!==require('./package.json').version)throw new Error('report version mismatch');if(!report.results.some(r=>r.ok&&r.firstTokenMs>0))throw new Error('no measured result');if(!report.tokenCounter?.calibrated)throw new Error('token counter not calibrated')"
          FAKE_FM_SCENARIO=legacy-available node bin/fm-bench.js models
          FAKE_FM_SCENARIO=legacy-available node bin/fm-bench.js --profile quick --no-progress --ci
      - name: macOS version gate without an explicit fm binary
        run: |
          major="$(sw_vers -productVersion | cut -d. -f1)"
          if [ "$major" -ge 27 ]; then
            echo "host is macOS $major — version gate is not exercisable here"
            exit 0
          fi
          set +e
          output="$(node bin/fm-bench.js --profile quick 2>&1)"
          status=$?
          set -e
          echo "$output"
          [ "$status" -eq 2 ] || { echo "expected exit 2, got $status"; exit 1; }
          case "$output" in
            *"unsupported macOS"*) echo "gate behaved as documented" ;;
            *) echo "expected an unsupported macOS message"; exit 1 ;;
          esac
      - name: Publish dry run
        run: npm run publish:dry-run

  # Single required status for branch protection, independent of the matrix.
  ci:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every matrix job to pass
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test.result }}"
            exit 1
          fi
