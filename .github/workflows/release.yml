name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v0.8.0"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      # id-token: npm trusted publishing (OIDC) and provenance attestations.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      # Node 24 ships npm 11, which publishes through npm trusted publishing
      # (OIDC) when the package trusts this workflow, and falls back to
      # NODE_AUTH_TOKEN otherwise. No dependency cache in a publish job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - run: npm ci
      - name: Lint, test, and verify package contents
        run: npm run check

      - name: Resolve release version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          ver="${INPUT_TAG:-$GITHUB_REF_NAME}"
          ver="${ver#v}"
          echo "semver=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "Release version: $ver"

      - name: Verify package.json matches tag
        env:
          EXPECTED: ${{ steps.version.outputs.semver }}
        run: |
          set -euo pipefail
          actual="$(node -p "require('./package.json').version")"
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::package.json version ($actual) does not match tag ($EXPECTED)"
            exit 1
          fi

      - name: Publish to npm
        id: npm
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.semver }}
        run: |
          set -euo pipefail
          npm --version
          if npm view "fm-bench@${VERSION}" version 2>/dev/null | grep -qx "$VERSION"; then
            echo "fm-bench@${VERSION} is already on npm — skipping publish."
            echo "status=already-published" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm publish --access public --provenance
          echo "status=published" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.semver }}
          NPM_OUTCOME: ${{ steps.npm.outcome }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          node scripts/changelog-release-notes.mjs "$VERSION" > "$notes_file"
          if [ "$NPM_OUTCOME" != "success" ]; then
            printf '\n> npm publish failed for this tag. See docs/releasing.md to configure trusted publishing, then re-run the Release workflow for %s.\n' "$TAG" >> "$notes_file"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists — updating notes from CHANGELOG.md."
            gh release edit "$TAG" --notes-file "$notes_file" --title "$TAG"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes_file"
          fi
          rm -f "$notes_file"

      - name: Fail the release when npm publish failed
        if: steps.npm.outcome != 'success'
        run: |
          echo "::error::npm publish failed. Configure npm trusted publishing for dvnold/fm-bench (release.yml) or refresh the NPM_TOKEN secret, then re-run this workflow."
          exit 1

      - name: Verify the published package
        if: steps.npm.outcome == 'success'
        env:
          VERSION: ${{ steps.version.outputs.semver }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y >/dev/null
          # A new version can take several minutes to be served everywhere.
          installed=false
          for attempt in $(seq 1 30); do
            if npm install "fm-bench@${VERSION}" --prefer-online --no-audit --no-fund >/dev/null 2>&1; then
              installed=true
              break
            fi
            echo "fm-bench@${VERSION} not installable yet (attempt $attempt/30)"
            sleep 20
          done
          if [ "$installed" != true ]; then
            echo "::error::fm-bench@${VERSION} was published but is still not installable after 10 minutes"
            exit 1
          fi
          test "$(./node_modules/.bin/fm-bench --version)" = "$VERSION"
          FM_BIN="$GITHUB_WORKSPACE/test/fixtures/fake-fm.mjs" ./node_modules/.bin/fm-bench --profile quick --no-progress --ci
